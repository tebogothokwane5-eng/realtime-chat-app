<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat App</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body class="chat-body">

    <div class="chat-app">

        <!-- Sidebar -->
        <aside class="chat-sidebar">

            <div class="sidebar-header">
                <div>
                    <h2>Chats</h2>
                    <p id="current-user">Loading...</p>
                </div>

                <button
                    id="logout-button"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>
            </div>

            <!-- Group Chats -->
            <div class="group-chat-section">
                <div class="group-section-header">
                    <h3>Group Chats</h3>

                    <button
                        id="create-group-button"
                        type="button"
                        class="create-group-button"
                    >
                        + Create Group
                    </button>
                </div>

                <div id="groups-list" class="users-list">
                    <p class="empty-text">No groups yet.</p>
                </div>
            </div>

            <!-- Private Chats -->
            <div class="private-chat-section">
                <h3>Private Chats</h3>
            </div>

            <div id="users-list" class="users-list">
                <p class="empty-text">Loading users...</p>
            </div>

        </aside>

        <!-- Conversation -->
        <main class="conversation">

            <div class="conversation-header">
                <div>
                    <h2 id="conversation-name">
                        Select a conversation
                    </h2>

                    <p id="conversation-status">
                        Choose someone from the left
                    </p>
                </div>

                <div class="call-controls">
                    <button
                        id="start-voice-call"
                        type="button"
                        title="Start voice call"
                        aria-label="Start voice call"
                        disabled
                    >
                        📞
                    </button>

                    <button
                        id="start-video-call"
                        type="button"
                        title="Start video call"
                        aria-label="Start video call"
                        disabled
                    >
                        📹
                    </button>
        <button
            id="end-call-button"
            type="button"
            title="End call"
            aria-label="End call"
            hidden
        >🔴 Hang Up</button>

                </div>
            </div>

            <div
                id="messages"
                class="messages"
            >
                <div class="welcome-message">
                    <h3>Welcome to Chat App</h3>
                    <p>
                        Select a user to start chatting.
                    </p>
                </div>
            </div>

            <form
                id="message-form"
                class="message-form"
            >
                <div
                    id="reply-preview"
                    class="reply-preview"
                    hidden
                >
                    <div class="reply-preview-text">
                        <strong id="reply-preview-name"></strong>
                        <span id="reply-preview-content"></span>
                    </div>

                    <button
                        id="cancel-reply-button"
                        class="cancel-reply-button"
                        type="button"
                        aria-label="Cancel reply"
                    >
                        &times;
                    </button>
                </div>

                <div class="message-composer">
                    <div class="emoji-picker-wrapper">
                        <button
                            id="emoji-button"
                            class="emoji-button"
                            type="button"
                            aria-label="Choose emoji"
                            title="Add emoji"
                            disabled
                        >
                            😀
                        </button>

                        <div
                            id="emoji-picker"
                            class="emoji-picker"
                            hidden
                        >
                            <button type="button" data-emoji="😀">😀</button>
                            <button type="button" data-emoji="😂">😂</button>
                            <button type="button" data-emoji="😊">😊</button>
                            <button type="button" data-emoji="😍">😍</button>
                            <button type="button" data-emoji="😎">😎</button>
                            <button type="button" data-emoji="😢">😢</button>
                            <button type="button" data-emoji="😮">😮</button>
                            <button type="button" data-emoji="👍">👍</button>
                            <button type="button" data-emoji="👎">👎</button>
                            <button type="button" data-emoji="❤️">❤️</button>
                            <button type="button" data-emoji="🔥">🔥</button>
                            <button type="button" data-emoji="🎉">🎉</button>
                            <button type="button" data-emoji="🙏">🙏</button>
                            <button type="button" data-emoji="👏">👏</button>
                            <button type="button" data-emoji="💯">💯</button>
                            <button type="button" data-emoji="🚛">🚛</button>
                        </div>
                    </div>

                    <!-- Media Sharing Dropdown -->
                    <div class="media-sharing-container">

                        <button
                            id="media-menu-button"
                            class="media-menu-button"
                            type="button"
                            aria-label="Media sharing"
                            aria-expanded="false"
                            aria-controls="media-dropdown"
                        >
                            📎 Media ▾
                        </button>

                        <div
                            id="media-dropdown"
                            class="media-dropdown"
                            hidden
                        >
                            <button
                                id="media-image-option"
                                type="button"
                            >
                                📷 Send Image
                            </button>

                            <button
                                id="media-video-option"
                                type="button"
                            >
                                🎬 Send Video
                            </button>
                        </div>

                    </div>

                    <button
                        id="image-button"
                        hidden
                        class="image-button"
                        type="button"
                        aria-label="Send image"
                        title="Send image"
                        disabled
                    >
                        📷
                    </button>

                    <input
                        id="image-input"
                        type="file"
                        accept="image/png,image/jpeg,image/gif,image/webp"
                        hidden
                    >

                    <button
                        id="video-button"
                        hidden
                        class="image-button"
                        type="button"
                        aria-label="Send video"
                        title="Send video"
                        disabled
                    >
                        🎬
                    </button>

                    <input
                        id="video-input"
                        type="file"
                        accept="video/mp4,video/webm"
                        hidden
                    >

                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                        disabled
                    >

                    <button
                        id="voice-button"
                        type="button"
                        aria-label="Record voice note"
                        title="Record voice note"
                        disabled
                    >
                        🎤
                    </button>

                    <span
                        id="voice-timer"
                        class="voice-timer"
                        hidden
                        aria-live="off"
                    >
                        0:00
                    </span>

                    <button
                        id="send-button"
                        type="submit"
                        disabled
                    >
                        Send
                    </button>
                </div>
            </form>

        </main>

    </div>

    <div
        id="image-viewer"
        class="image-viewer"
        hidden
        aria-hidden="true"
    >
        <button
            id="image-viewer-close"
            class="image-viewer-close"
            type="button"
            aria-label="Close image"
            title="Close"
        >
            &times;
        </button>

        <img
            id="image-viewer-image"
            class="image-viewer-image"
            src=""
            alt="Shared image"
        >

        <div
            id="image-viewer-name"
            class="image-viewer-name"
        ></div>
    </div>




<!-- WebRTC audio and video elements -->
<div id="call-media-panel" hidden>
    <div id="webrtc-status" style="color: white; padding: 8px;">
        WebRTC: waiting
    </div>
    <video
        id="remote-video"
        autoplay
        playsinline
    ></video>

    <video
        id="local-video"
        autoplay
        playsinline
        muted
    ></video>

    <audio
        id="remote-audio"
        autoplay
    ></audio>
</div>

    <script
        src="{{ url_for('static', filename='js/chat.js') }}"
    ></script>
</body>
</html>
